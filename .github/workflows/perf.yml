name: Perf

# Load test of the ledger-core API (k6) on a GitHub-hosted runner: PostgreSQL 17 and Kafka 4.1
# (KRaft) in containers, the jar on the host with a JFR recording. Results land in the job
# summary and in the `perf-*` artifact. See docs/PERFORMANCE.md.
on:
  workflow_dispatch:
    inputs:
      rate_scale:
        description: Multiplier for every scenario's target rate (1 = the documented workload)
        default: '1'
      hold_s:
        description: Steady-state seconds per scenario (at least 180 for a reported run)
        default: '200'
  push:
    branches: ['perf/**']

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: false

# Read-only token; nothing is deployed and there are no secrets.
permissions:
  contents: read

env:
  # Local CI values only. The database and broker live and die inside this job and are not
  # reachable from outside the runner; this is not a real secret.
  LEDGER_DB_NAME: ledger
  LEDGER_DB_USER: ledger
  LEDGER_DB_PASSWORD: ci-local-only-not-a-secret
  PG_CONTAINER: ledger-pg
  BASE_URL: http://localhost:8080

defaults:
  run:
    shell: bash

jobs:
  # Same commands as ci.yml's backend job (that workflow only triggers for main), so every
  # tuning commit on a perf/** branch is proven by the full test suite and the coverage gates.
  verify:
    name: Backend verify (mvn verify, coverage gates)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21 (Amazon Corretto)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: corretto
          cache: maven
      - name: Verify
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Check integration tests ran
        working-directory: backend
        run: |
          count=$(cat ledger-service/target/surefire-reports/TEST-*IntegrationTest.xml 2>/dev/null \
            | grep -o '<testsuite [^>]*' | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "integration tests run: ${count:-0}"
          test "${count:-0}" -gt 0 || { echo "::error::No integration tests ran"; exit 1; }
          if grep -l 'skipped="[1-9]' ledger-service/target/surefire-reports/TEST-*.xml; then
            echo "::error::Some tests were skipped"; exit 1
          fi
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  perf:
    name: k6 load test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # Single-node KRaft broker. One PLAINTEXT listener advertised as localhost:9092, which is
      # what the jar on the runner host connects to through the published port.
      kafka:
        image: apache/kafka:4.1.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v7

      - name: Record runner hardware
        run: |
          mkdir -p perf-out
          {
            echo "### Environment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\` (run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}) |"
            echo "| Runner | ${RUNNER_OS} ${RUNNER_ARCH}, image ${ImageOS:-unknown} ${ImageVersion:-} |"
            echo "| CPU | $(lscpu | awk -F: '/^Model name/ {gsub(/^ +/, "", $2); print $2}'), $(nproc) vCPU |"
            echo "| RAM | $(free -m | awk '/^Mem:/ {print $2}') MiB |"
            echo "| Disk (workspace) | $(df -h --output=size,avail "$GITHUB_WORKSPACE" | tail -1 | awk '{print $1 " total, " $2 " free"}') |"
            echo "| Kernel | $(uname -r) |"
          } | tee perf-out/env.md >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21 (Amazon Corretto)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: corretto
          cache: maven

      - name: Build the jar
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      # GitHub service containers cannot take command arguments, and pg_stat_statements has to be
      # preloaded with `-c shared_preload_libraries`, so PostgreSQL is started with docker run.
      # Settings are fixed for every run (they are infrastructure, not the thing under test);
      # durability is the default (fsync on, synchronous_commit on).
      - name: Start PostgreSQL 17 with pg_stat_statements
        run: |
          docker run -d --name "$PG_CONTAINER" \
            -e POSTGRES_DB="$LEDGER_DB_NAME" -e POSTGRES_USER="$LEDGER_DB_USER" -e POSTGRES_PASSWORD="$LEDGER_DB_PASSWORD" \
            -p 127.0.0.1:5432:5432 \
            postgres:17-alpine \
            -c shared_preload_libraries=pg_stat_statements \
            -c pg_stat_statements.track=all \
            -c track_io_timing=on \
            -c shared_buffers=1GB \
            -c max_wal_size=2GB \
            -c max_connections=100 \
            -c deadlock_timeout=1s \
            -c log_lock_waits=on
          for i in $(seq 1 60); do
            docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -U "$LEDGER_DB_USER" -d "$LEDGER_DB_NAME" && break
            sleep 1
          done
          docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -U "$LEDGER_DB_USER" -d "$LEDGER_DB_NAME"
          # In the `postgres` database so the `ledger` schema stays empty for Flyway.
          docker exec "$PG_CONTAINER" psql -U "$LEDGER_DB_USER" -d postgres -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"

      - name: Start the ledger-service jar (JFR recording on)
        run: |
          JAR=$(ls backend/ledger-service/target/ledger-service-*.jar | head -1)
          echo "jar: $JAR"
          export LEDGER_DB_URL="jdbc:postgresql://localhost:5432/${LEDGER_DB_NAME}"
          export LEDGER_DB_USER LEDGER_DB_PASSWORD
          export LEDGER_KAFKA_BOOTSTRAP=localhost:9092
          nohup java -Xms1g -Xmx2g \
            -XX:StartFlightRecording=filename="$PWD/perf-out/ledger.jfr",settings=profile,dumponexit=true,maxsize=300m \
            -jar "$JAR" > perf-out/app.log 2>&1 &
          echo $! > perf-out/app.pid
          for i in $(seq 1 120); do
            if curl -fsS "$BASE_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "application is UP after ${i}s"; exit 0
            fi
            if ! kill -0 "$(cat perf-out/app.pid)" 2>/dev/null; then
              echo "::error::application exited during startup"; tail -n 80 perf-out/app.log; exit 1
            fi
            sleep 1
          done
          echo "::error::application did not become healthy"; tail -n 80 perf-out/app.log; exit 1

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run the k6 scenarios
        id: k6
        continue-on-error: true
        env:
          RATE_SCALE: ${{ inputs.rate_scale || '1' }}
          HOLD_S: ${{ inputs.hold_s || '200' }}
          OUT_DIR: perf-out
        run: |
          k6 version | tee perf-out/k6-version.txt
          java -version 2>&1 | tee perf-out/java-version.txt
          docker exec "$PG_CONTAINER" psql -U "$LEDGER_DB_USER" -d postgres -c "select pg_stat_statements_reset()" > /dev/null
          perf/scripts/sample.sh perf-out/samples.log 5 &
          SAMPLER=$!
          set +e
          k6 run --quiet --no-color perf/k6/ledger.js 2>&1 | tee perf-out/k6.log
          status=${PIPESTATUS[0]}
          kill "$SAMPLER" 2>/dev/null
          exit "$status"

      - name: Collect database, JVM and reconciliation data
        if: always()
        run: |
          perf/scripts/collect-pg.sh perf-out/pg
          docker stats --no-stream > perf-out/docker-stats.txt 2>&1 || true
          curl -fsS "$BASE_URL/actuator/prometheus" > perf-out/prometheus-final.txt 2>/dev/null || true
          # Independent of k6: the books must balance and no counter may differ from the history.
          curl -fsS --max-time 120 "$BASE_URL/api/v1/reconciliation" > perf-out/reconciliation.json || echo '{}' > perf-out/reconciliation.json
          jq -c '{balanced, accountMismatches: (.accountMismatches | length)}' perf-out/reconciliation.json
          jq -e '.balanced == true and (.accountMismatches | length) == 0 and all(.ledgers[]; .balanced)' perf-out/reconciliation.json > /dev/null \
            && echo "reconciliation: PASS" | tee perf-out/reconciliation-verdict.txt \
            || echo "reconciliation: FAIL" | tee perf-out/reconciliation-verdict.txt

      - name: Stop the application and digest the JFR recording
        if: always()
        run: |
          if [ -f perf-out/app.pid ]; then
            kill -TERM "$(cat perf-out/app.pid)" 2>/dev/null || true
            for i in $(seq 1 60); do kill -0 "$(cat perf-out/app.pid)" 2>/dev/null || break; sleep 1; done
          fi
          if [ -f perf-out/ledger.jfr ]; then
            ls -l perf-out/ledger.jfr
            jfr summary perf-out/ledger.jfr > perf-out/jfr-summary.txt 2>&1 || true
            jfr view hot-methods perf-out/ledger.jfr > perf-out/jfr-hot-methods.txt 2>&1 || true
            jfr view contention-by-site perf-out/ledger.jfr > perf-out/jfr-contention.txt 2>&1 || true
            jfr view allocation-by-site perf-out/ledger.jfr > perf-out/jfr-allocation.txt 2>&1 || true
            jfr view gc-pauses perf-out/ledger.jfr > perf-out/jfr-gc-pauses.txt 2>&1 || true
            jfr view gc perf-out/ledger.jfr > perf-out/jfr-gc.txt 2>&1 || true
          fi
          docker logs "$PG_CONTAINER" > perf-out/postgres.log 2>&1 || true

      - name: Write the job summary
        if: always()
        run: |
          {
            if [ -f perf-out/summary.md ]; then cat perf-out/summary.md; else echo "No k6 summary was produced."; fi
            echo
            echo "$(cat perf-out/reconciliation-verdict.txt 2>/dev/null)"
            echo
            echo "### Host, JVM and PostgreSQL signals"
            echo
            if [ -s perf-out/samples.log ]; then python3 -I perf/scripts/report.py samples perf-out/samples.log; fi
            echo
            echo "### Top PostgreSQL statements by total time"
            echo
            if [ -s perf-out/pg/pg_stat_statements_top.csv ]; then python3 -I perf/scripts/report.py pgtop perf-out/pg/pg_stat_statements_top.csv; fi
            echo
            echo "Row counts: $(cat perf-out/pg/row_counts.txt 2>/dev/null)"
            echo
            echo "k6 $(cat perf-out/k6-version.txt 2>/dev/null | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"
          cp perf-out/summary.md perf-out/summary-table.md 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-out/
          retention-days: 30

      # The run counts only if k6 passed, the books balance, every scenario carried traffic
      # and errors stayed under 1 %.
      - name: Gate
        if: always()
        run: |
          fail=0
          if [ "${{ steps.k6.outcome }}" != "success" ]; then echo "::error::k6 failed or a threshold was crossed"; fail=1; fi
          grep -q 'PASS' perf-out/reconciliation-verdict.txt 2>/dev/null || { echo "::error::reconciliation did not pass"; fail=1; }
          if [ -f perf-out/summary.json ]; then python3 -I perf/scripts/report.py gate perf-out/summary.json || fail=1; else echo "::error::no summary.json"; fail=1; fi
          exit $fail
